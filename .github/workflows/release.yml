name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  prepare_release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.ensure_release.outputs.release_id }}
    steps:
      - name: Ensure draft release exists
        id: ensure_release
        uses: actions/github-script@v7
        with:
          script: |
            const tagName = context.ref.replace('refs/tags/', '');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const releaseName = `Vesta ${tagName}`;
            const releaseBody = 'See the assets to download and install this version.';

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            let release = releases.find((r) => r.tag_name === tagName && r.draft);
            if (!release) {
              release = releases.find((r) => r.tag_name === tagName);
            }

            if (!release) {
              const created = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tagName,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease: false,
              });
              release = created.data;
              core.info(`Created release ${release.id} for ${tagName}.`);
            } else {
              core.info(`Using existing release ${release.id} for ${tagName}.`);
            }

            core.setOutput('release_id', String(release.id));

  release:
    needs: prepare_release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            sidecar_triple: "aarch64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            sidecar_triple: "x86_64-unknown-linux-gnu"
          - platform: "windows-latest"
            args: ""
            sidecar_triple: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies & build sidecar (Unix)
        if: matrix.platform != 'windows-latest'
        run: |
          cd vesta-backend
          pip install -r requirements.txt
          pip install pyinstaller
          TARGET_TRIPLE=${{ matrix.sidecar_triple }} FORCE_REBUILD=1 bash build_sidecar.sh
        shell: bash

      - name: Install Python dependencies & build sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          cd vesta-backend
          pip install -r requirements.txt
          pip install pyinstaller
          $env:TARGET_TRIPLE = "${{ matrix.sidecar_triple }}"
          $env:FORCE_REBUILD = "1"
          bash build_sidecar.sh
        shell: pwsh

      - name: Install frontend dependencies
        run: npm install
        working-directory: vesta-frontend

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare_release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseName: "Vesta v__VERSION__"
          releaseBody: "See the assets to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          projectPath: vesta-frontend
